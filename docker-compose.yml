services:

  fastapi:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: career-fastapi
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  streamlit:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: career-streamlit
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8502:8501"
    env_file:
      - .env
    depends_on:
      - fastapi